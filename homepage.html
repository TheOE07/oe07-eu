                <script>
                function updateClock() {
                    const now = new Date();
                    const formatter = new Intl.DateTimeFormat("en-GB", {
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit",
                        timeZoneName: "short",
                        weekday: "long",
                        day: "2-digit",
                        month: "long",
                        year: "numeric"
                    });

                    const parts = formatter.formatToParts(now);
                    const value = (type) => parts.find((part) => part.type === type)?.value || "";
                    document.getElementById("dateTime").textContent = `${value("hour")}:${value("minute")}:${value("second")} ${value("timeZoneName")}, ${value("weekday")}, ${value("day")} ${value("month")} ${value("year")}`;
                }

                updateClock();
                setInterval(updateClock, 1000);
                </script>
